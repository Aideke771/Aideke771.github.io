<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видео по ссылке</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #0f1420; color: #e8ecf4; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
  p.sub { color: #8b94a7; font-size: 14px; margin-bottom: 20px; text-align: center; }
  .card { background: #1a2233; border: 1px solid #2a3650; border-radius: 14px; padding: 20px; width: 100%; max-width: 560px; margin-bottom: 16px; }
  button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  button.primary { background: #3b82f6; color: #fff; }
  button.primary:hover { background: #2f6fd6; }
  button.ghost { background: #2a3650; color: #e8ecf4; }
  button.ghost:hover { background: #35446a; }
  video { width: 100%; border-radius: 10px; background: #000; margin-top: 12px; }
  input[type=text] { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #2a3650; background: #0f1420; color: #e8ecf4; font-size: 22px; text-align: center; letter-spacing: 6px; font-weight: 700; margin-top: 8px; }
  .code { font-size: 44px; font-weight: 800; text-align: center; letter-spacing: 10px; color: #86efac; margin: 12px 0; }
  .step { font-size: 14px; line-height: 1.5; margin-bottom: 6px; }
  .step b { color: #9fc1ff; }
  #status { margin-top: 12px; padding: 10px; border-radius: 10px; text-align: center; font-size: 14px; background: #2a3650; }
  #status.ok { background: #14532d; color: #86efac; }
  #status.wait { background: #422006; color: #fcd34d; }
  #status.err { background: #4c1212; color: #fca5a5; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>📹 Видео по ссылке</h1>
<p class="sub">Прямое соединение между браузерами. Нужен только короткий код.</p>

<div class="card" id="menu">
  <div class="step"><b>Кто вы?</b></div>
  <button class="primary" onclick="startStream()">📱 Я ПОКАЗЫВАЮ — включить камеру</button>
  <button class="ghost" onclick="startWatch()">🖥️ Я СМОТРЮ — подключиться к другу</button>
</div>

<!-- ============ ПОКАЗЫВАЮЩИЙ (друг со смартфоном) ============ -->
<div class="card hidden" id="streamer">
  <div class="step"><b>Шаг 1.</b> Сообщите зрителю этот код (любым мессенджером):</div>
  <div class="code" id="roomCode">····</div>
  <button class="ghost" onclick="copyCode()">📋 Скопировать код</button>
  <div id="sStatus" class="wait hidden"></div>
  <video id="localVideo" autoplay muted playsinline></video>
</div>

<!-- ============ ЗРИТЕЛЬ (вы) ============ -->
<div class="card hidden" id="watcher">
  <div class="step"><b>Введите код, который прислал показывающий:</b></div>
  <input type="text" id="codeInput" maxlength="4" inputmode="numeric" placeholder="0000">
  <button class="primary" onclick="connectWatch()">🔌 Подключиться</button>
  <div id="wStatus" class="wait hidden"></div>
  <video id="remoteVideo" autoplay playsinline></video>
</div>

<script>
let peer = null;
let localStream = null;

function show(id){ document.getElementById(id).classList.remove('hidden'); }
function setStatus(el, text, cls){
  const s = document.getElementById(el);
  s.classList.remove('hidden'); s.className = cls; s.textContent = text;
}
function copyCode(){
  const c = document.getElementById('roomCode').textContent;
  navigator.clipboard.writeText(c).then(()=>alert('Код '+c+' скопирован! Отправьте его зрителю.'));
}

/* ---------- ПОКАЗЫВАЮЩИЙ ---------- */
async function startStream(){
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;
  } catch(e){
    alert('Не удалось включить камеру: ' + e.message + '\n\nРазрешите доступ к камере и микрофону в браузере.');
    return;
  }
  createStreamerPeer();
  document.getElementById('menu').style.display = 'none';
  show('streamer');
}

function createStreamerPeer(){
  const code = String(Math.floor(1000 + Math.random()*9000));
  setStatus('sStatus', '⏳ Создаём комнату...', 'wait');
  peer = new Peer('camlink-' + code);

  peer.on('open', ()=>{
    document.getElementById('roomCode').textContent = code;
    setStatus('sStatus', '⏳ Код готов! Ждём зрителя... Страницу не закрывайте.', 'wait');
  });

  peer.on('call', (call)=>{
    call.answer(localStream);
    setStatus('sStatus', '✅ Зритель подключился! Вы в эфире.', 'ok');
    call.on('close', ()=> setStatus('sStatus', '⏳ Зритель отключился. Ждём снова...', 'wait'));
  });

  peer.on('disconnected', ()=>{ peer.reconnect(); });
  peer.on('error', (e)=>{
    if (e.type === 'unavailable-id'){ createStreamerPeer(); } // код занят, генерируем новый
    else setStatus('sStatus', '⚠️ Ошибка: ' + e.type + ' — обновите страницу', 'err');
  });
}

/* ---------- ЗРИТЕЛЬ ---------- */
function startWatch(){
  document.getElementById('menu').style.display = 'none';
  show('watcher');
  document.getElementById('codeInput').focus();
}

function connectWatch(){
  const code = document.getElementById('codeInput').value.trim();
  if (!/^\d{4}$/.test(code)){ alert('Введите 4-значный код, например 4821'); return; }

  if (peer){ peer.destroy(); peer = null; }
  setStatus('wStatus', '⏳ Подключаемся... Страницу не закрывайте.', 'wait');

  peer = new Peer();
  peer.on('open', ()=>{
    const call = peer.call('camlink-' + code);
    call.on('stream', (remote)=>{
      document.getElementById('remoteVideo').srcObject = remote;
      setStatus('wStatus', '✅ Соединение установлено! Вы видите друга.', 'ok');
    });
    call.on('close', ()=> setStatus('wStatus', '⚠️ Соединение закрыто друзем.', 'err'));
    call.on('error', ()=> setStatus('wStatus', '⚠️ Ошибка соединения.', 'err'));
  });
  peer.on('error', (e)=>{
    if (e.type === 'peer-unavailable')
      setStatus('wStatus', '⚠️ Комната с таким кодом не найдена. Проверьте код и попробуйте снова.', 'err');
    else
      setStatus('wStatus', '⚠️ Ошибка: ' + e.type + ' — попробуйте ещё раз', 'err');
  });
  peer.on('disconnected', ()=>{ if (peer) peer.reconnect(); });
}

document.getElementById('codeInput').addEventListener('keydown', (e)=>{
  if (e.key === 'Enter') connectWatch();
});
</script>
</body>
</html>
